name: Website
on:
  push:
    branches: [ main ]
jobs:
  build:
    name: Website
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.156.0'
        extended: true

    - name: Build Website
      env:
        USER: ${{ secrets.SERVER_USER }}
        TARGET: ${{ secrets.SERVER_PATH }}
        KEY: ${{ secrets.SERVER_KEY }}
        DOMAIN: ${{ secrets.SERVER_DOMAIN }}
      run: |
        cd website && make
        # Guard against markdown that Goldmark turns into <del>/<sub>/<sup>.
        # A single `~` around a numeric range (`2~3%`) is the known case (#103);
        # the book writes `2 至 3%` instead. Checking the rendered HTML rather
        # than the source also catches delimiters that pair across a soft line
        # break, and stops a broken page before it is uploaded.
        if grep -rnoE --include='*.html' '<(del|sub|sup)>' public/; then
          echo "::error::unintended <del>/<sub>/<sup> in rendered output"
          exit 1
        fi
        mkdir ~/.ssh
        echo "$KEY" | tr -d '\r' > ~/.ssh/id_ed25519
        chmod 400 ~/.ssh/id_ed25519
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_ed25519
        ssh-keyscan -H $DOMAIN >> ~/.ssh/known_hosts
        scp -r public/* $USER@$DOMAIN:$TARGET
